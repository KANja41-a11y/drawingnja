<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drawing App</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --accent: #38bdf8;
      --muted: #94a3b8;
      --tool-bg: #0f172a;
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --accent: #0ea5e9;
      --muted: #64748b;
      --tool-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.25s, color 0.25s;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--tool-bg);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .theme-btn:hover {
      background: var(--border);
    }

    .toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--tool-bg);
      padding: 5px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .tool-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    .tool-btn:hover {
      background: var(--border);
    }

    .tool-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .tool-btn:active {
      transform: scale(0.92);
    }

    input[type="color"] {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }

    input[type="color"]::-webkit-color-swatch {
      border-radius: 6px;
      border: 2px solid var(--border);
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 110px;
    }

    .slider-group label {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 70px;
      height: 5px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--panel);
    }

    .slider-value {
      font-size: 0.8rem;
      min-width: 28px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .action-btn {
      height: 36px;
      padding: 0 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .btn-clear {
      background: #7f1d1d;
      color: #fecaca;
    }

    .btn-clear:hover {
      background: #991b1b;
    }

    .btn-download {
      background: #065f46;
      color: #a7f3d0;
    }

    .btn-download:hover {
      background: #047857;
    }

    .btn-undo {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .btn-undo:hover {
      background: #1e40af;
    }

    [data-theme="light"] .btn-clear {
      background: #fee2e2;
      color: #991b1b;
    }

    [data-theme="light"] .btn-download {
      background: #d1fae5;
      color: #065f46;
    }

    [data-theme="light"] .btn-undo {
      background: #dbeafe;
      color: #1e40af;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      background: #ffffff;
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
      max-width: 100%;
      max-height: 100%;
    }

    .status {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 6px 12px;
      text-align: center;
      background: var(--panel);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 700px) {
      header h1 { font-size: 1rem; }
      .toolbar { padding: 8px; gap: 6px; }
      .tool-group { padding: 4px 6px; }
      .tool-btn, input[type="color"] { width: 34px; height: 34px; }
      .action-btn { height: 34px; padding: 0 10px; font-size: 0.8rem; }
      .slider-group { min-width: 95px; }
      input[type="range"] { width: 55px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>✏️ Drawing App</h1>
    <div class="header-right">
      <button class="theme-btn" id="themeBtn" title="Ganti Tema">🌙</button>
    </div>
  </header>

  <div class="toolbar">
    <!-- Tools -->
    <div class="tool-group">
      <button class="tool-btn active" id="brushBtn" title="Kuas">🖌️</button>
      <button class="tool-btn" id="eraserBtn" title="Penghapus">🧽</button>
      <button class="tool-btn" id="lineBtn" title="Garis Lurus">／</button>
      <button class="tool-btn" id="rectBtn" title="Kotak">▭</button>
      <button class="tool-btn" id="circleBtn" title="Lingkaran">○</button>
    </div>

    <!-- Colors -->
    <div class="tool-group">
      <input type="color" id="colorPicker" value="#1e293b" title="Warna Kuas" />
      <input type="color" id="bgPicker" value="#ffffff" title="Warna Background" />
    </div>

    <!-- Size -->
    <div class="tool-group slider-group">
      <label>Ukuran</label>
      <input type="range" id="sizeSlider" min="1" max="60" value="5" />
      <span class="slider-value" id="sizeValue">5</span>
    </div>

    <!-- Opacity -->
    <div class="tool-group slider-group">
      <label>Opacity</label>
      <input type="range" id="opacitySlider" min="5" max="100" value="100" />
      <span class="slider-value" id="opacityValue">100%</span>
    </div>

    <!-- Actions -->
    <div class="tool-group">
      <button class="action-btn btn-undo" id="undoBtn" title="Undo (Ctrl+Z)">↩️ Undo</button>
      <button class="action-btn btn-clear" id="clearBtn" title="Hapus Semua">🗑️ Hapus</button>
      <button class="action-btn btn-download" id="downloadBtn" title="Unduh PNG">⬇️ Unduh</button>
    </div>
  </div>

  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="drawCanvas"></canvas>
  </div>

  <div class="status" id="status">Siap menggambar • Geser jari/mouse di canvas</div>

  <script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    // Elements
    const brushBtn = document.getElementById('brushBtn');
    const eraserBtn = document.getElementById('eraserBtn');
    const lineBtn = document.getElementById('lineBtn');
    const rectBtn = document.getElementById('rectBtn');
    const circleBtn = document.getElementById('circleBtn');
    const colorPicker = document.getElementById('colorPicker');
    const bgPicker = document.getElementById('bgPicker');
    const sizeSlider = document.getElementById('sizeSlider');
    const sizeValue = document.getElementById('sizeValue');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');
    const clearBtn = document.getElementById('clearBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const undoBtn = document.getElementById('undoBtn');
    const themeBtn = document.getElementById('themeBtn');
    const status = document.getElementById('status');

    // State
    let isDrawing = false;
    let currentTool = 'brush';
    let startX = 0, startY = 0;
    let lastX = 0, lastY = 0;
    let history = [];
    const MAX_HISTORY = 35;
    let snapshot = null; // untuk shape preview

    // ========== Theme ==========
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('drawing-theme', theme);
    }

    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // Load saved theme
    const savedTheme = localStorage.getItem('drawing-theme') || 'dark';
    setTheme(savedTheme);

    // ========== Canvas ==========
    function getCanvasSize() {
      const rect = wrapper.getBoundingClientRect();
      return { w: rect.width, h: rect.height };
    }

    function resizeCanvas(keepContent = false) {
      const { w, h } = getCanvasSize();
      const dpr = window.devicePixelRatio || 1;

      let oldData = null;
      if (keepContent && canvas.width > 0) {
        oldData = canvas.toDataURL();
      }

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      // Fill background
      ctx.fillStyle = bgPicker.value;
      ctx.fillRect(0, 0, w, h);

      if (oldData) {
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, w, h);
          saveState();
        };
        img.src = oldData;
      } else {
        saveState();
      }
    }

    function saveState() {
      if (history.length >= MAX_HISTORY) history.shift();
      history.push(canvas.toDataURL());
    }

    function restoreState(dataUrl) {
      const { w, h } = getCanvasSize();
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
      };
      img.src = dataUrl;
    }

    function undo() {
      if (history.length <= 1) {
        status.textContent = 'Tidak ada yang bisa di-undo';
        return;
      }
      history.pop();
      restoreState(history[history.length - 1]);
      status.textContent = 'Undo berhasil';
    }

    // ========== Helpers ==========
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function getColorWithOpacity() {
      const hex = colorPicker.value;
      const alpha = opacitySlider.value / 100;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function setActiveTool(tool) {
      currentTool = tool;
      [brushBtn, eraserBtn, lineBtn, rectBtn, circleBtn].forEach(btn => btn.classList.remove('active'));
      const map = {
        brush: brushBtn,
        eraser: eraserBtn,
        line: lineBtn,
        rect: rectBtn,
        circle: circleBtn
      };
      map[tool].classList.add('active');

      const labels = {
        brush: 'Mode: Kuas',
        eraser: 'Mode: Penghapus',
        line: 'Mode: Garis Lurus',
        rect: 'Mode: Kotak',
        circle: 'Mode: Lingkaran'
      };
      status.textContent = labels[tool];
      canvas.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
    }

    // ========== Drawing ==========
    function startDrawing(e) {
      e.preventDefault();
      isDrawing = true;
      const pos = getPos(e);
      startX = lastX = pos.x;
      startY = lastY = pos.y;

      if (currentTool === 'brush' || currentTool === 'eraser') {
        ctx.beginPath();
        ctx.arc(startX, startY, sizeSlider.value / 2, 0, Math.PI * 2);
        ctx.fillStyle = currentTool === 'eraser' ? bgPicker.value : getColorWithOpacity();
        ctx.fill();
      } else {
        // Simpan snapshot untuk preview shape
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);

      if (currentTool === 'brush' || currentTool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = currentTool === 'eraser' ? bgPicker.value : getColorWithOpacity();
        ctx.lineWidth = sizeSlider.value;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalAlpha = currentTool === 'eraser' ? 1 : (opacitySlider.value / 100);
        ctx.stroke();
        ctx.globalAlpha = 1;
        lastX = pos.x;
        lastY = pos.y;
      } else {
        // Preview shape
        if (snapshot) ctx.putImageData(snapshot, 0, 0);
        drawShape(startX, startY, pos.x, pos.y, true);
      }
    }

    function stopDrawing(e) {
      if (!isDrawing) return;
      isDrawing = false;

      if (currentTool !== 'brush' && currentTool !== 'eraser') {
        const pos = e ? getPos(e) : { x: lastX, y: lastY };
        if (snapshot) ctx.putImageData(snapshot, 0, 0);
        drawShape(startX, startY, pos.x, pos.y, false);
        snapshot = null;
      }
      saveState();
      status.textContent = 'Siap menggambar';
    }

    function drawShape(x1, y1, x2, y2, isPreview) {
      ctx.beginPath();
      ctx.strokeStyle = getColorWithOpacity();
      ctx.lineWidth = sizeSlider.value;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = opacitySlider.value / 100;

      if (currentTool === 'line') {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      } else if (currentTool === 'rect') {
        const w = x2 - x1;
        const h = y2 - y1;
        ctx.strokeRect(x1, y1, w, h);
      } else if (currentTool === 'circle') {
        const radius = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
        ctx.arc(x1, y1, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // ========== Events ==========
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);
    canvas.addEventListener('touchcancel', stopDrawing);

    // Tool buttons
    brushBtn.addEventListener('click', () => setActiveTool('brush'));
    eraserBtn.addEventListener('click', () => setActiveTool('eraser'));
    lineBtn.addEventListener('click', () => setActiveTool('line'));
    rectBtn.addEventListener('click', () => setActiveTool('rect'));
    circleBtn.addEventListener('click', () => setActiveTool('circle'));

    // Sliders
    sizeSlider.addEventListener('input', () => {
      sizeValue.textContent = sizeSlider.value;
    });

    opacitySlider.addEventListener('input', () => {
      opacityValue.textContent = opacitySlider.value + '%';
    });

    // Background color change
    bgPicker.addEventListener('change', () => {
      // Isi ulang background, gambar tetap di atasnya (dengan cara re-draw dari history)
      if (history.length > 0) {
        const last = history[history.length - 1];
        const { w, h } = getCanvasSize();
        ctx.fillStyle = bgPicker.value;
        ctx.fillRect(0, 0, w, h);
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, w, h);
          saveState();
        };
        img.src = last;
      }
      status.textContent = 'Background diubah';
    });

    // Actions
    clearBtn.addEventListener('click', () => {
      if (confirm('Hapus semua gambar?')) {
        const { w, h } = getCanvasSize();
        ctx.fillStyle = bgPicker.value;
        ctx.fillRect(0, 0, w, h);
        history = [];
        saveState();
        status.textContent = 'Canvas dikosongkan';
      }
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `gambar-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      status.textContent = 'Gambar diunduh!';
    });

    undoBtn.addEventListener('click', undo);

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'z') {
        e.preventDefault();
        undo();
      }
    });

    // Resize
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => resizeCanvas(true), 150);
    });

    // Init
    resizeCanvas(false);
  </script>
</body>
</html>
